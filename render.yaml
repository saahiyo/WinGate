databases:
  - name: wingate-db
    databaseName: wingate_db
    user: wingate_admin
    plan: free
    ipAllowList: []

services:
  - type: web
    name: wingate-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: WinGate API
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wingate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MIN_PASSWORD_LENGTH
        value: "8"
      - key: CORS_ORIGINS
        value: "*"
      - key: PROVIDER_API_URL
        value: https://api.shreewinapi.com
      - key: PROVIDER_ORIGIN
        value: https://shreewin39.com
      - key: GAME_BASE_URL
        value: https://h5.ar-lottery01.com
